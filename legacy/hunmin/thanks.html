  <style>:root{--navy:#0d2c56;--blue:#176c67;--cream:#fbf5e9;--muted:#45566b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);background-image:radial-gradient(rgba(94,73,38,.08) .45px,transparent .75px);background-size:8px 8px;font-family:"Noto Serif KR","Nanum Myeongjo","KoPub Batang","Batang",serif;color:var(--navy)}.card{width:min(620px,calc(100% - 32px));margin:24px 0;padding:42px 28px;background:#fffaf1;border:5px double #176c67;border-radius:3px;text-align:center}.logo{width:110px;height:auto;margin:0 auto 28px}.badge{font-size:13px;font-weight:800;color:#bd322b}h1{margin:18px 0 16px;font-size:clamp(28px,6vw,38px);line-height:1.3;letter-spacing:-.045em}p{color:var(--muted);font-size:15px;line-height:1.75}dl{margin:24px 0;padding:18px;background:#f3e7d4;border-radius:3px}dt{font-size:13px;color:var(--muted);font-weight:700}dd{margin:8px 0 0;font-family:ui-monospace,monospace;font-size:28px;font-weight:800;letter-spacing:.12em;line-height:1.7;overflow-wrap:anywhere}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 20px;border:1px solid #c89a4d;border-radius:3px;background:var(--navy);color:#fff;text-decoration:none;font-weight:750;font-size:14px}.result-guide{margin-top:24px;padding:18px;background:#fbf5e9;border:1px solid #d9c5a1;border-radius:3px;text-align:left}.result-guide h2{margin:0 0 8px;font-size:16px}.result-guide p{margin:0;font-size:13px}.result-guide strong{color:var(--navy)}a.secondary{background:#fff;color:var(--navy);border:1px solid #c89a4d}a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}[hidden]{display:none!important}</style>
